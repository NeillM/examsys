name: Automatic tests
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  phpunit:
    runs-on: ubuntu-latest
    container:
      image: uonlearningtech/examsys-php-apache:${{ matrix.php }}
      volumes:
        - ${{ github.workspace }}:/var/www/html

    services:
      db:
        image: mysql:${{ matrix.mysql }}
        env:
          # The MySQL docker container requires these environment variables to be set
          # so we can create the test database.
          # See: https://hub.docker.com/_/mysql
          MYSQL_ROOT_PASSWORD: test
        ports:
          # Opens port 3306 on service container and host
          # https://docs.github.com/en/actions/using-containerized-services/about-service-containers
          - 3306:3306
          # Before continuing, verify the mysql container is reachable from the ubuntu host
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      # Add in Rserve so that we can run all the calculation question unit tests.
      calc:
        image: uonlearningtech/examsys-rserve:${{ matrix.rserve }}
        ports:
          - 6311:6311

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.3-nodebug
            mysql: 8.4
            rserve: latest

    steps:
      - name: Checkout ExamSys
        uses: actions/checkout@v7

      - name: Create unattended installation files
        run: |
          cp .github/workflows/settings.xml config/settings.xml
          cp .github/workflows/phpunit.xml config/phpunit.xml
          sed -i 's/#dbUser#/root/g' config/phpunit.xml
          sed -i 's/#dbPassword#/test/g' config/phpunit.xml

      - name: Installing node stuff
        run: npm install

      - name: Running grunt
        run: grunt

      # We need to install ExamSys before we can install the test suite.
      - name: Install ExamSys
        env:
          XDEBUG_CONFIG: mode=off
        run: php -dxdebug.mode=off cli/init.php -u root -s db -t 3306 -n examsys -p test

      - name: Install unit test suite
        env:
          XDEBUG_CONFIG: mode=off
        run: php -dxdebug.mode=off testing/unittest/cli/init.php --clean

      - name: Run unit tests
        env:
          XDEBUG_CONFIG: mode=off
        run: vendor/bin/phpunit -c testing/unittest/config/phpunit.xml

  behat:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.3-nodebug
            mysql: 8.4
            timezone: Europe/London

    env:
      EXAMSYS_DOCKER_WWWROOT: ${{ github.workspace }}/examsys
      EXAMSYS_DOCKER_MYSQLROOT: test
      EXAMSYS_DOCKER_PHP: ${{ matrix.php }}
      EXAMSYS_DOCKER_WEB_HTTP_PORT: 80
      EXAMSYS_DOCKER_WEB_HTTPS_PORT: 443
      EXAMSYS_DOCKER_SELENIUM: 1
      EXAMSYS_DOCKER_MYSQLVERSION: ${{ matrix.mysql }}
      EXAMSYS_DOCKER_MYSQLTZ: ${{ matrix.timezone }}
      EXAMSYS_DOCKER_RSERVE: 1

    steps:
      - name: Checkout ExamSys
        uses: actions/checkout@v7
        with:
          path: examsys

      # For behat we need the text editor plugins.
      # We will build them in an extras directory, which we will clean up before running the tests.
      - name: Checkout equation editor
        uses: actions/checkout@v7
        with:
          repository: examsys/examsys-tinymce-plugin-maths-equation-editor
          path: extras/maths-equation-editor

      - name: Install dependencies equation editor
        uses: borales/actions-yarn@v5
        with:
          dir: extras/maths-equation-editor
          cmd: install

      - name: Build equation editor
        uses: borales/actions-yarn@v5
        with:
          dir: extras/maths-equation-editor
          cmd: build

      - name: Checkout ruby editor
        uses: actions/checkout@v7
        with:
          repository: examsys/examsys-tinymce-plugin-ruby-annotation
          path: extras/ruby-annotation

      - name: Install dependencies ruby editor
        uses: borales/actions-yarn@v5
        with:
          dir: extras/ruby-annotation
          cmd: install

      - name: Build ruby editor
        uses: borales/actions-yarn@v5
        with:
          dir: extras/ruby-annotation
          cmd: build

      - name: Install text editor plugins
        run: |
          mv extras/maths-equation-editor/dist/maths-equation-editor examsys/plugins/texteditor/plugin_tinymce_texteditor/js/plugins
          mv extras/ruby-annotation/dist/ruby-annotation examsys/plugins/texteditor/plugin_tinymce_texteditor/js/plugins
          rm -rf extras

      - name: Checkout ExamSys docker
        uses: actions/checkout@v7
        with:
          repository: examsys/examsys-docker
          path: docker

      - name: Create unattended installation files
        run: |
          cp docker/settings-innodb.xml examsys/config/settings.xml
          cp docker/behat-innodb.xml examsys/config/behat.xml
          sed -i 's/<!-- Enter the password you set in EXAMSYS_DOCKER_MYSQLROOT -->/${{ env.EXAMSYS_DOCKER_MYSQLROOT }}/g' examsys/config/behat.xml

      - name: Start ExamSys docker instance
        run: docker/examsys-compose.sh up -d

      - name: Install dependencies
        run: docker/examsys-compose.sh exec -T web npm install

      - name: Build CSS and JavaScript
        run: docker/examsys-compose.sh exec -T web grunt

      # We need to install ExamSys before we can install the test suite.
      - name: Install ExamSys
        run: docker/examsys-compose.sh exec -T web php cli/init.php -u root -p $EXAMSYS_DOCKER_MYSQLROOT -s db -t 3306 -n examsys

      - name: Install behat test suite
        run: docker/examsys-compose.sh exec -T web php testing/behat/cli/init.php --clean

      - name: Run Behat tests
        run: docker/examsys-compose.sh exec -T web vendor/bin/behat --config testing/behat/config/behat.yml

      - name: Stop ExamSys docker instance
        run: docker/examsys-compose.sh down
