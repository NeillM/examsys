<p>
{% for i,p in data.blankoptions %}
    {% if p.itemtype == 'blurb' %}
    {{p.itemvalue|raw}}
    {% else %}
    <select name="q{{data.questionno}}_{{p.itemcount}}" {% if p.unans %} class="unans" {% endif %}>
                    <option value="u"></option>
       {% for a in p.itemvalue %}
                    <option value="{{a.answer}}" {% if a.selected %} selected {% endif %}>{{a.answer}}</option>
       {% endfor %}
    </select>
    {% endif %}
{% endfor %}
</p>
