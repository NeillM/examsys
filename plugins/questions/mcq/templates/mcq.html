<blockquote {% if data.unanswered %} class="unans" {% endif %}>
    <div class="option">
        <select {%if data.unanswered %} class="unans" {% endif %} name="q{{data.questionno}}" size="1">
            <option value=""></option>
{% for i,p in data.options %}
            <option value="{{i}}" {% if p.selected %} selected {% endif %}>{{p.optiontext|raw}}</option>
{% endfor %}
        </select>
    </div>
    <div>
        <input type="hidden" name="dismiss{{data.questionno}}" id="dismiss{{data.questionno}}" value="{{data.dismiss}}" />
    </div>
</blockquote>
