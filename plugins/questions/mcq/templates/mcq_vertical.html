<blockquote {% if data.unanswered %} class="unans" {% endif %}>
    <table cellpadding="2" cellspacing="0" border="0">
{% for i,p in data.options %}
        <tr>
            <td>
                <input type="radio" name="q{{data.questionno}}" value="{{i}}" {% if p.selected %} checked="checked" {% endif %}/>
            </td>
            <td>
            {% if p.optiontextdisplay %}
            <span {% if p.inact %} class="inact" {% else %} class="act" {% endif %} id="{{data.questionno}}_{{i}}"> {{p.optiontext|raw}}</span></br>
            {% endif %}
            {% if p.displayoptionmedia %}
                {% include 'paper/media.html' with {'data': p.optionmedia} %}
            {% endif %}
            </td>
        </tr>
{% endfor %}
{% if data.negativemarking %}
        <tr>
            <td>
                <input type="radio" name="q{{data.questionno}}" value="a" {% if data.abstainselected %} checked="checked" {% endif %}/>
            </td>
            <td style="color:{{data.labelcolour}}">{{lang.abstain}}</td>
        </tr>
{% endif %}
    </table>
<div>
    <input type="hidden" name="dismiss{{data.questionno}}" id="dismiss{{data.questionno}}" value="{{data.dismiss}}" />
</div>
</blockquote>
