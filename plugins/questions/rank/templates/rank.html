<blockquote>
    <table cellpadding="2" cellspacing="0" border="0">
{% for i,p in data.options %}
        <tr {% if p.unans %} class="unans" {% endif %}>
            <td class="option">
                <select name="{{p.optionno}}" id ="{{p.optionno}}" class="rankselect q"{{data.questionno}}">
                    <option value="u"></option>
    {# Display each rank option with computed ordinal #}
    {% for idx,selected in p.selected %}
                    <option value="{{idx}}" {% if selected.value %} selected {% endif %}>
                            {% if selected.ordinal == 0 %}
                                {{lang.na}} 
                            {% else %}
                                {{selected.ordinal}}
                            {% endif %}
                    </option>
    {% endfor %}
                </select>
            </td>
            <td>
                <span {% if p.inact %} class="inact" {% else %} class="act" {% endif %} id="{{p.optionno}}">{{p.optiontext}}</span>
            </td>
        </tr>
{% endfor %}
    </table>
    <div>
        <input type="hidden" name="dismiss{{data.questionno}}" id="dismiss{{data.questionno}}" value="{{data.dismiss}}" />
    </div>
</blockquote>
