<blockquote>
    <table cellpadding="2" cellspacing="0" border="0">
{% for i,p in data.get('options') %}
        <tr {% if p.unans %} class="unans" {% endif %}>
            <td class="option">
                <select name="{{p.optionno}}" class="rankselect q"{{data.get('questionno')}}">
                    <option value="u"></option>
    {% if p.na %}
                    <option value="0" {% if p.selected %} selected {% endif %}>{{lang.na}}</option>
    {% endif %}
    {% for c in 1..p.totalrank %}
                    <option value="{{c}}" {% if p.selected %} selected {% endif %}>
        {% if data.get('language') == 'en' %}
            {% if c == 1 %}
                {{c}}st
            {% elseif c == 2 %}
                {{c}}nd
            {% elseif c == 3 %}
                {{c}}rd
            {% else %}
                {{c}}th
            {% endif %}
        {% else %}
                {{c}}
        {% endif %}
                    </option>
    {% endfor %}
                </select>
            </td>
            <td>
                <span {% if p.inact %} class="inact" {% else %} class="act" {% endif %} id="{{p.optionno}}">{{p.optiontext}}</span>
            </td>
        </tr>
{% endfor %}
    </table>
    <div>
        <input type="hidden" name="dismiss{{data.get('questionno')}}" id="dismiss{{data.get('questionno')}}" value="{{data.get('dismiss')}}" />
    </div>
</blockquote>
