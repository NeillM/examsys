{% if data.style == '' %}
<textarea class="{{data.type}}" id="{{data.questionno}}" name="{{data.questionno}}">{{data.useranswer|raw}}</textarea>
{% else %}
<textarea class="{{data.type}}" id="{{data.questionno}}" name="{{data.questionno}}" style="{{data.style}}">{{data.useranswer|raw}}</textarea>
{% endif %}
