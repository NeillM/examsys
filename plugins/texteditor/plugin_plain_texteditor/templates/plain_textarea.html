{% if data.mathjax == true %}
<p>{{lang.mathjaxinstructions|raw}}</p>
    {% if data.style == '' %}
    <textarea onkeyup="Preview{{data.id}}.Update()" class="plaintextarea" id="{{data.id}}" name="{{data.name}}">{{data.content}}</textarea>
    {% else %}
    <textarea onkeyup="Preview{{data.id}}.Update()" class="plaintextarea" id="{{data.id}}" name="{{data.name}}" style="{{data.style}}">{{data.content}}</textarea>
    {% endif %}
{% else %}
    {% if data.style == '' %}
    <textarea class="plaintextarea" id="{{data.id}}" name="{{data.name}}">{{data.content}}</textarea>
    {% else %}
    <textarea class="plaintextarea" id="{{data.id}}" name="{{data.name}}" style="{{data.style}}">{{data.content}}</textarea>
    {% endif %}
{% endif %}
