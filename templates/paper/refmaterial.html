{% for ref in data.ref %}
<div class="refhead" id="refhead{{ref.num}}" onclick="changeRef({{ref.num}})" style="top: calc(31px + 31px * {{ref.num}})">{{ref.title}}</div>
<div class="framecontent" id="framecontent{{ref.num}}" style="top: calc(31px + 31px * {{ref.num}})">{{ref.title}}</div>
{% endfor %}
<script>
  changeRef({{data.refpane}});
</script>
