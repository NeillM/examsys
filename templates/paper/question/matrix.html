<table cellpadding="2" cellspacing="0" border="1" class="matrix">
    <tr>
        <td colspan="2">&nbsp;</td>
{% for m in data.matrixoptions %}
        <td>{{m.option}}</td>
{% endfor %}
    </tr>
{% for s in data.matrixscenarios %}
    <tr {% if s.unanswered %} class="unans" {% endif %}>
        <td align="right">{{s.id}}</td>
        <td>{{s.value}}</td>
    {% for m in data.matrixoptions %}
        <td>
            <div align="center">
                <input type="radio" name="q{{data.get('questionno')}}_{{loop.index}}" value="{{m.tmppartid}}" {% if m.selected %} checked="checked" {% endif %}/>
            </div>
        </td>
    {% endfor %}
    </tr>
{% endfor %}
</table>
