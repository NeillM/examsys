<div class="config">
    <div class="configheading">
        <label for="{{data.setting}}">{{data.setting}}</label>
        <img src="{{path}}/artwork/tooltip_icon.gif" class="help_tip" title="{{lang.setting}}" />
    </div>
    <div class="configvalue">
        <input type="password" size="20" id="{{data.setting}}" name="{{data.setting}}" value="{{data.value|raw}}" {{data.disabled}} />
        {% if data.disabled != "" %}
        <div class="configextra">{{lang.fileoverride}}</div>
        {% endif %}
    </div>
</div>
