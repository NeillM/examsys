<tr>
    <td class="field">
        <label for="{{data.setting}}">{{data.setting}}</label>&nbsp;
        <img src="{{path}}/artwork/tooltip_icon.gif" class="help_tip" title="{{lang.setting}}" />
    </td>
    <td>
        <input type="text" size="{{data.size}}" id="{{data.setting}}" name="{{data.setting}}" value="{{data.value}}" {{data.disabled}} />
    </td>
    {% if data.disabled != "" %}
    <td>{{lang.fileoverride}}</td>
    {% endif %}
</tr>
