
<div class="checklist-item">
    <img src="{{ data.icon }}" class="checklist-icon" alt="{{ data.alt|default('') }}" />
    <a href="{{ data.href }}" class="checklist {{ data.link_class|default('properties') }}">
        {{ data.text }}
    </a>
    <span class="checklist-status">{{ data.status }}</span>
</div>
