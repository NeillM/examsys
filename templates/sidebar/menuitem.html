<div class="{% if data.disabled %}grey {% endif %}{{ data.classes }}" 
    role="menuitem" 
    {% if data.disabled %}aria-disabled="true" {% endif %}
    {% if data.hasPopup %}
    aria-haspopup="{{ data.popupType }}"
    aria-expanded="false"
    aria-controls="popup{{ data.data_attributes.popupid }}"
    {% endif %}
    {% if data.id %}id="{{ data.id }}" {% endif %}
    {% if data.data_attributes %}
    {% for key, value in data.data_attributes %}
    data-{{ key }}="{{ value }}"
    {% endfor %}
    {% endif %}> 
    {% if not data.disabled and data.href %}
    <a href="{{ data.href }}" tabindex="{{ data.tabindex }}">
    {% endif %}
    {% if data.icon %}
    <img class="sidebar_icon" src="{{ data.icon }}" alt="" />
    {% endif %}
    {{ data.text}}
    {% if not data.disabled and data.href %}
    </a>
    {% endif %}
</div>
